services:
  kafka:
    image: apache/kafka:3.7.0
    ports:
      - "9092:9092"    # INTERNAL (для docker-сети, если с хоста — не обязательно)
      - "9094:9094"    # EXTERNAL (для хоста)
    environment:
      # Основные настройки KRaft
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL

      # Слушатели (Listener)
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:9094,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT

      # Обязательные для KRaft и локального запуска
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"   # <-- без него не запустится
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    healthcheck:
      test: [ "CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1" ]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    ports: ["8080:8080"]
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    depends_on:
      kafka:
        condition: service_healthy

  init-topics:
    build: .
    command: python -m scripts.create_topics --bootstrap kafka:9092
    depends_on:
      kafka:
        condition: service_healthy
    restart: "no"

  generator:
    build: .
    command: python -m generator.simulate --bootstrap kafka:9092
    depends_on:
      init-topics:
        condition: service_completed_successfully
    restart: unless-stopped

  p1:
    build: .
    command: python -m processors.telemetry --bootstrap kafka:9092
    depends_on:
      init-topics:
        condition: service_completed_successfully
    restart: unless-stopped

  p2:
    build: .
    command: python -m processors.queue --bootstrap kafka:9092
    depends_on:
      init-topics:
        condition: service_completed_successfully
    restart: unless-stopped

  p3:
    build: .
    command: python -m processors.rec_decide --bootstrap kafka:9092
    depends_on:
      init-topics:
        condition: service_completed_successfully
    restart: unless-stopped