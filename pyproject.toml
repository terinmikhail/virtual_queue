[project]
name = "virtual-queues"
version = "0.1.0"
description = "Virtual queues for stations from telemetry (Kafka stream processing)"
requires-python = ">=3.11"
dependencies = [
    "confluent-kafka>=2.4.0",
    "pydantic>=2.7",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"